plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '2.25.0'
    id 'com.google.protobuf' version '0.9.4' // Versiune corectă de plugin
}

application {
    mainClass = 'ro.mpp2024.Start'
}

group = 'ro.mpp2024'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':BasketModel')
    implementation project(':BasketServer')
    implementation project(':BasketServices')
    implementation project(':BasketNetworking')
    implementation project(':BasketPersistence')

    implementation 'org.openjfx:javafx-controls:17.0.12'
    implementation 'org.openjfx:javafx-fxml:17.0.12'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.14.0'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.14.0'
    implementation group: 'com.google.guava', name: 'guava', version: '31.0.1-jre'
    implementation 'org.springframework:spring-context:6.1.5'

    // Dependențe gRPC
    implementation 'io.grpc:grpc-netty:1.45.1'
    implementation 'io.grpc:grpc-stub:1.45.1'
    implementation 'io.grpc:grpc-protobuf:1.45.1'
    implementation 'com.google.protobuf:protobuf-java:3.19.4'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    protobuf 'com.google.protobuf:protoc:3.19.4'  // Versiune corectă pentru protoc
}


javafx {
    version = "17.0.12"
    modules = ['javafx.controls', 'javafx.fxml']
}
sourceSets {
    main {
        proto {
            srcDirs 'src/main/proto'  // Directorul care conține fișierele .proto
        }
    }
}

// Configurarea pentru generarea fișierelor Java din .proto
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.19.4"  // Versiunea corectă
    }
    plugins {
        grpc {
            path = "C:\\protoc-gen-grpc-java\\protoc-gen-grpc-java.exe"
        }

    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE  // Sau DuplicatesStrategy.INCLUDE, în funcție de comportamentul dorit
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateProto')
}

test {
    useJUnitPlatform()
}
