<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>X and O</title>
  <style>
    table {
      border-collapse: collapse;
      margin-top: 20px;
    }
    td {
      width: 60px;
      height: 60px;
      text-align: center;
      font-size: 2em;
      border: 1px solid #000;
      cursor: pointer;
    }
    td.disabled {
      pointer-events: none;
      background-color: #eee;
    }
    #status {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<h2>X și O</h2>
<p id="status">The system is deciding who begins...</p>
<table id="board"></table>
<button onclick="location.reload()">Reset the game</button>

<script>
  let board = [["", "", ""], ["", "", ""], ["", "", ""]];
  let human = Math.random() < 0.5 ? "X" : "O";
  let computer = human === "X" ? "O" : "X";
  let currentPlayer = "X";
  let gameOver = false;

  document.getElementById("status").textContent = `you are: ${human}`;

  function createBoard() {
    const table = document.getElementById("board");
    table.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const row = document.createElement("tr");
      for (let j = 0; j < 3; j++) {
        const cell = document.createElement("td");
        cell.dataset.row = i;
        cell.dataset.col = j;
        cell.textContent = board[i][j];
        if (!board[i][j] && !gameOver) {
          cell.addEventListener("click", handleClick);
        } else {
          cell.classList.add("disabled");
        }
        row.appendChild(cell);
      }
      table.appendChild(row);
    }
  }

  function handleClick(e) {
    if (gameOver || currentPlayer !== human) return;
    const row = parseInt(e.target.dataset.row);
    const col = parseInt(e.target.dataset.col);
    if (board[row][col] !== "") return;

    board[row][col] = human;
    currentPlayer = computer;
    updateUI();

    fetch("game.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ board, player: human })
    })
            .then(res => res.json())
            .then(data => {
              board = data.board;
              currentPlayer = human;
              updateUI();
              if (data.result !== "continue") {
                document.getElementById("status").textContent = data.result;
                gameOver = true;
              }
            });
  }

  function updateUI() {
    createBoard();
  }

  if (currentPlayer !== human) {
    fetch("game.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ board, player: human })
    })
            .then(res => res.json())
            .then(data => {
              board = data.board;
              currentPlayer = human;
              updateUI();
            });
  } else {
    createBoard();
  }
</script>
</body>
</html>
